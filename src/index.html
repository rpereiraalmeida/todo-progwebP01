<!-- initial file -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/colors-helpers.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/reboot.css">

    <title>To-do</title>
</head>

<body>
    <header class="header">
        <div>
            <img src="./assets/MenuToggle.svg" class="cursor-pointer" alt="" onclick="toggleMenu()"
                style="margin-right:10px;">
            <a href="index.html"><img src="./assets/Home.svg" class="cursor-pointer" alt=""></a>
        </div>
        <div class="logo">
            <span>Today's Task</span>
            <img src="./assets/Logo.svg" alt="">
        </div>
        <div class="search-bar">
            <svg width="25" height="25" viewBox="0 0 25 25" class="svg-white" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M10.8333 2.5C6.24083 2.5 2.5 6.24083 2.5 10.8333C2.5 15.4258 6.24083 19.1667 10.8333 19.1667C12.8304 19.1667 14.6645 18.4575 16.1019 17.2803L21.0775 22.2559C21.1543 22.3358 21.2462 22.3997 21.348 22.4437C21.4498 22.4877 21.5593 22.5109 21.6702 22.512C21.781 22.5132 21.891 22.4922 21.9937 22.4502C22.0963 22.4083 22.1896 22.3464 22.268 22.268C22.3464 22.1896 22.4083 22.0963 22.4502 21.9937C22.4922 21.891 22.5132 21.781 22.512 21.6702C22.5109 21.5593 22.4877 21.4498 22.4437 21.348C22.3997 21.2462 22.3358 21.1543 22.2559 21.0775L17.2803 16.1019C18.4575 14.6645 19.1667 12.8304 19.1667 10.8333C19.1667 6.24083 15.4258 2.5 10.8333 2.5ZM10.8333 4.16667C14.5251 4.16667 17.5 7.14156 17.5 10.8333C17.5 14.5251 14.5251 17.5 10.8333 17.5C7.14156 17.5 4.16667 14.5251 4.16667 10.8333C4.16667 7.14156 7.14156 4.16667 10.8333 4.16667Z"
                    fill="black" fill-opacity="0.6" />
            </svg>

            <input type="text" class="text-color-white border-0" placeholder="Procure por uma tarefa">
        </div>
    </header>
    <div class="container">
        <aside class="sidebar">
            <button type="button" class="btn-primary sidebar-item">Create Task +</button>
            <nav>
                <div class="sidebar-item" onclick="navegateTo('index.html')">
                    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M23 27L15 20L7 27V5C7 3.895 7.895 3 9 3H21C22.105 3 23 3.895 23 5V27Z"
                            fill="#607D8B" />
                    </svg>
                    <strong>Tarefas Pendentes</strong>

                </div>
                <div class="sidebar-item" onclick="navegateTo('tarefasConcluidas.html')">
                    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M4 5C2.895 5 2 5.895 2 7V23C2 24.105 2.895 25 4 25H12C13.105 25 14 25.895 14 27V7C14 5.895 13.105 5 12 5H4ZM18 5C16.895 5 16 5.895 16 7V27C16 25.895 16.895 25 18 25H26C27.105 25 28 24.105 28 23V7C28 5.895 27.105 5 26 5H18Z"
                            fill="#607D8B" />
                    </svg>

                    <strong> Tarefas Concluidas</strong>
                </div>
                <div class="sidebar-item" onclick="navegateTo('listas.html')">
                    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M5 4C3.895 4 3 4.895 3 6V9V11H22H27V8C27 6.895 26.105 6 25 6H12.1992L11.582 4.9707C11.221 4.3687 10.5702 4 9.86719 4H5ZM2.50196 13C1.49296 13 0.770409 13.9774 1.06641 14.9414L4.03516 24.5879C4.29416 25.4269 5.06927 26 5.94727 26H15H24.0527C24.9307 26 25.7058 25.4269 25.9648 24.5879L28.9336 14.9414C29.2296 13.9774 28.507 13 27.498 13H15H2.50196Z"
                            fill="#607D8B" />
                    </svg>

                    <strong>Listas</strong>
                </div>
            </nav>

            <div class="stats">
                <div>
                    <strong>33% - Pendente</strong>
                    <div class="bg-ligth stats-bar">
                        <div class="bg-alert stats-bar-progress"></div>
                    </div>
                </div>
                <div>
                    <strong>33% - Completo</strong>
                    <div class="bg-ligth stats-bar">
                        <div class="bg-success stats-bar-progress"></div>
                    </div>
                </div>
                <div>
                    <strong>33% - Atrasado</strong>
                    <div class="bg-ligth stats-bar">
                        <div class="bg-danger stats-bar-progress"></div>
                    </div>
                </div>
            </div>
        </aside>
        <main class="main">
            <div class="tasks-completas-container">
                <h4>Tarefas Pendentes</h4>

            </div>
        </main>
        <aside class="edit-form close-edit-form">
            <img src="./assets/Delete.svg" style="margin-left:auto;" onclick="toggleFormEdit()">
            <h2>Título</h2>
            <input type="text" class="edit-form-text">
            <h3>Descrição</h3>
            <textarea class="edit-form-textarea"></textarea>
            <h4>Lista Pertencente(opcional)</h4>
            <p>Ao selecionar uma lista, a task será exibida associada a ela</p>
            <select name="select" class="edit-form-selector">
                <option value="Lista1">Lista 1</option>
                <option value="Lista2">Lista 2</option>
            </select>
            <h5>Data Limite</h5>
            <input type="date" class="edit-form-date">
            <button type="button" class="btn-salvar-alteracoes" onclick="fecharmenu()">Salvar alterações </button>
        </aside>
    </div>
    <script src="./js/ui.js"></script>
</body>

</html>
